# Automazione 7 — Alert consumo energetico anomalo
# Dal kit del libro "Home Assistant: la Casa che Lavora per Te"

alias: "Consumo energetico anomalo"
description: "Avvisa se il consumo totale casa supera una soglia insolita per più di 10 minuti"
triggers:
  - trigger: numeric_state
    entity_id: sensor.potenza_casa
    above: 5000  # adatta questa soglia al tuo contratto/impianto
    for:
      minutes: 10
actions:
  - action: notify.mobile_app_telefono
    data:
      title: "🚨 Consumo anomalo"
      message: "Consumo casa sopra soglia da 10 minuti: {{ states('sensor.potenza_casa') }} W."
mode: single
