# Automazione 9 — Clima adattivo su presenza reale
# Dal kit del libro "Home Assistant: la Casa che Lavora per Te"

alias: "Clima in eco a casa vuota"
triggers:
  - trigger: state
    entity_id: group.famiglia
    to: "not_home"
    for:
      minutes: 15
actions:
  - action: climate.set_temperature
    target:
      entity_id: climate.soggiorno
    data:
      temperature: 17
mode: single
---
alias: "Clima torna a target quando qualcuno rientra"
triggers:
  - trigger: state
    entity_id: group.famiglia
    to: "home"
actions:
  - action: climate.set_temperature
    target:
      entity_id: climate.soggiorno
    data:
      temperature: 21
mode: single
