# Automazione 17 — Allerta allagamento/perdita d'acqua
# Dal kit del libro "Home Assistant: la Casa che Lavora per Te"

alias: "Allerta allagamento"
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.allagamento_lavatrice
      - binary_sensor.allagamento_bagno
      - binary_sensor.allagamento_cucina
    to: "on"
actions:
  - action: notify.mobile_app_telefono
    data:
      title: "🚨 ALLAGAMENTO RILEVATO"
      message: "{{ trigger.to_state.attributes.friendly_name }}: acqua rilevata. Controlla subito."
      data:
        push:
          interruption-level: critical  # iOS: suona anche a telefono silenzioso
  - action: switch.turn_off
    target:
      # se hai un'elettrovalvola generale collegata a un relè smart, questa la chiude
      entity_id: switch.elettrovalvola_acqua_generale
mode: single
