# Automazione 18 — Modalità "cinema"
# Dal kit del libro "Home Assistant: la Casa che Lavora per Te"

alias: "Modalità cinema"
triggers: []
actions:
  - action: cover.close_cover
    target:
      area_id: soggiorno
  - action: light.turn_on
    target:
      entity_id: light.soggiorno
    data:
      brightness_pct: 10
      color_name: "warm_white"
  - action: media_player.turn_on
    target:
      entity_id: media_player.soggiorno_tv
mode: single
