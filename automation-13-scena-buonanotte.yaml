# Automazione 13 — Scena "buonanotte"
# Dal kit del libro "Home Assistant: la Casa che Lavora per Te"

alias: "Buonanotte"
triggers: []  # attivata manualmente da dashboard/comando vocale, non da un orario fisso
actions:
  - action: light.turn_off
    target:
      entity_id: all
  - action: climate.set_temperature
    target:
      entity_id: climate.camera_1
    data:
      temperature: 19
  - action: lock.lock
    target:
      entity_id: lock.porta_ingresso
  - action: alarm_control_panel.alarm_arm_home
    target:
      entity_id: alarm_control_panel.allarme_casa
  - action: notify.mobile_app_telefono
    data:
      title: "🌙 Buonanotte"
      message: "Luci spente, porta bloccata, allarme inserito in modalità notte."
mode: single
